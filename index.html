<script>
const VER='2.17'; // app version, bumped automatically by tools/build.py on every change
/* Turning numbers and dates into text. Pure functions, no DOM. */

// A number for display: at most 2 decimals, no trailing zeros; '' for empty or invalid input.
const fmt = x => (x === '' || x == null || isNaN(x) ? '' : +(+x).toFixed(2));

const ageText = t => {
  const days = Math.floor((Date.now() - t) / 864e5);
  return days < 1 ? 'today' : days < 60 ? days + 'd ago' : Math.round(days / 30.4) + 'mo ago';
};

const dateText = t =>
  new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

// 0 kg on the bar means a bodyweight set.
const weightLabel = w => (w > 0 ? fmt(w) : 'BW');

// RIR is stored as a number; 6 means "5+" (more than 5 reps left). RPE = 10 − RIR.
const rirLabel = v => (v == null || v === '' ? '' : +v > 5 ? '5+' : fmt(v));
const rpeLabel = v => (v == null || v === '' ? '' : +v > 5 ? '<5' : fmt(10 - v));
/* Small DOM helpers. */

const $ = (selector, root = document) => root.querySelector(selector),
  app = $('#app');

// Escape text before putting it into HTML (every name you type goes through this).
const esc = s =>
  String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// The page scrolls inside <main>, not the window.
const scrollMainTo = (x, y) => {
    const m = $('main');
    if (m) m.scrollTop = y;
  },
  mainScrollY = () => $('main')?.scrollTop || 0;

let toastTimer;
const toast = message => {
  const t = $('#toast');
  t.textContent = message;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 4000);
};
/* Where data lives.
 *   localStorage: small settings and the workout in progress, every key prefixed "lift-log:".
 *   IndexedDB (database "liftlog"): exercises, plans ("templates"), tested 1RMs ("pr_history") and logged sets. */

/* ---------- localStorage ----------
   Other apps may share this origin's localStorage, so every Lift Log key starts with "lift-log:".
   Old unprefixed keys are moved once. Keys whose content proves they're Lift Log's (workout in progress, backup
   settings) are removed afterwards; generic ones (rest, bw, ht, lb, dirty) are copied only if they look valid, and
   left in place because another app might own a key with the same name. */
const LS_PREFIX = 'lift-log:';
(() => {
  try {
    const L = localStorage,
      parse = v => {
        try {
          return JSON.parse(v);
        } catch {
          return null;
        }
      },
      between = (lo, hi) => v => +v >= lo && +v <= hi;
    const surelyOurs = {
        w: v => {
          const o = parse(v);
          return !!(o && Array.isArray(o.items) && o.sess > 0);
        },
        gh: v => {
          const o = parse(v);
          return !!(o && o.token && /lift-log/i.test(o.repo || ''));
        },
        gherr: v => /^Last automatic backup failed/.test(v),
      },
      looksValid = {
        rest: between(15, 1800),
        bw: between(20, 400),
        ht: between(100, 250),
        lb: between(1.5e12, 4e12),
        dirty: v => v == '0' || v == '1',
      };
    for (const k of [...Object.keys(surelyOurs), ...Object.keys(looksValid)]) {
      const v = L.getItem(k);
      if (v == null || L.getItem(LS_PREFIX + k) != null) continue;
      if (surelyOurs[k]) {
        if (surelyOurs[k](v)) {
          L.setItem(LS_PREFIX + k, v);
          L.removeItem(k);
        }
      } else if (looksValid[k](v)) L.setItem(LS_PREFIX + k, v);
    }
  } catch {}
})();

const lsSet = (k, v) => {
  try {
    localStorage.setItem(LS_PREFIX + k, v);
  } catch {}
};
const lsGet = k => {
  try {
    return localStorage.getItem(LS_PREFIX + k);
  } catch {
    return null;
  }
};

// Settings: your bodyweight (kg) and height (cm); 0 when not set.
const bodyweight = () => +lsGet('bw') || 0,
  height = () => +lsGet('ht') || 0;

/* ---------- IndexedDB ---------- */
let db;
const openDatabase = () =>
  new Promise((resolve, reject) => {
    const r = indexedDB.open('liftlog', 1);
    r.onupgradeneeded = () => {
      const d = r.result,
        keys = { keyPath: 'id', autoIncrement: true };
      d.createObjectStore('exercises', keys);
      d.createObjectStore('templates', keys);
      d.createObjectStore('pr_history', keys).createIndex('ex', 'exId');
      d.createObjectStore('sets', keys).createIndex('ex', 'exId');
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
const request = r =>
  new Promise((resolve, reject) => {
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
const store = (name, mode = 'readonly') => db.transaction(name, mode).objectStore(name);
// Everything in a store, or (with an index) everything matching a key, e.g. getAll('sets', 'ex', exerciseId).
// A set's RIR above 10 is treated as "not tracked".
const getAll = (name, index, key) =>
  request(index ? store(name).index(index).getAll(key) : store(name).getAll()).then(a =>
    name == 'sets' ? a.map(s => (s.rir > 10 ? { ...s, rir: null } : s)) : a,
  );
// Every change marks the data as changed, which schedules an automatic backup (backup.js).
const dbPut = (name, o) => (markDataChanged(), request(store(name, 'readwrite').put(o)));
const dbDelete = (name, id) => (markDataChanged(), request(store(name, 'readwrite').delete(id)));
/* The training maths: how strong you are, what to lift next, and how to adjust after each set.
 *
 * Everything here is a plain function of its inputs: no screen, no database. The one outside value is
 * your current bodyweight (bodyweight(), from Settings), needed for lifts where the load includes it.
 * tests/unit.test.mjs runs these functions on their own.
 *
 * Terms
 *   set     a logged set: { w: kg added to the bar, r: reps, rir: reps in reserve (null = not tracked),
 *           sess: workout id, t: time, wu: true for a warm-up, bw: your bodyweight that day }
 *   RIR     reps in reserve: how many more reps you could have done. RPE = 10 − RIR. 6 is stored for "5+".
 *   e1RM    estimated one-rep max, worked out from a set's weight, reps and RIR
 *   step    the exercise's weight increment (ex.inc); 0 means a bodyweight-only exercise
 */

/* ---------- 1RM maths ---------- */

// The fraction of your 1RM you can lift for `reps` with `rir` reps still in the tank. This is Epley's
// formula, counting the reps you had left as reps you could have done: 1 / (1 + (reps + RIR) / 30).
const fractionOf1RM = (reps, rir) => 1 / (1 + (reps + rir) / 30);
const estimate1RM = (weight, reps, rir) => weight / fractionOf1RM(reps, rir);
// The same formula solved for reps: how many reps a lifter with this 1RM can do at `weight`, leaving `rir`.
const repsAt = (oneRM, weight, rir) => 30 * (oneRM / weight - 1) - rir;

const hasRir = set => set.rir !== '' && set.rir != null && +set.rir >= 0 && +set.rir <= 10;
// One rep with nothing left counts as a tested 1RM.
const isMaxTest = set => +set.r === 1 && hasRir(set) && +set.rir === 0;
// Sets that say something about your strength: not warm-ups, RIR known and under 5, weight on the bar.
const isWorkingSet = s => !s.wu && s.rir != null && s.rir < 5 && s.w > 0;

// Round to the exercise's weight step. Step 0 (bodyweight only) just tidies to 2 decimals.
const roundToStep = (x, step) => (step > 0 ? +(Math.round(x / step) * step).toFixed(3) : +(+x).toFixed(2));
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

// Average where later values count more: weights 1, 2, 3, … from oldest to newest.
function recencyWeightedAverage(values) {
  let sum = 0,
    weights = 0;
  values.forEach((x, i) => {
    sum += x * (i + 1);
    weights += i + 1;
  });
  return sum / weights;
}

/* ---------- Bodyweight lifts ----------
   With "Load includes bodyweight" on (pull-ups, dips…), the maths uses you + the plate, while you always type
   and see only the added kg. Each logged set remembers your bodyweight at the time (set.bw). */

const bodyweightFor = ex => (ex?.bwl ? bodyweight() : 0);
// A set in total-load terms: added kg + bodyweight (that day's, or today's if it wasn't recorded).
const withBodyweight = (ex, s) =>
  ex?.bwl ? { ...s, w: (s.w === '' || s.w == null ? 0 : +s.w) + (s.bw ?? bodyweight()) } : s;
// Back from total load to what you put on the bar, rounded to the step. '' = bodyweight only / no suggestion.
const toLoadedWeight = (ex, total) => {
  if (ex?.bwl) {
    const added = roundToStep(+total - bodyweight(), ex.inc);
    return added > 0 ? added : '';
  }
  return total > 0 ? roundToStep(total, ex.inc) : '';
};

/* RIR is picked from a list: 0–5 in half steps, plus "5+" (stored as 6). A 5+ set stays in history and volume
   but, like a warm-up, never feeds suggestions, the strength estimate or the next-set adjustment. */
const RIR_CHOICES = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 6];

/* ---------- Strength ---------- */

// Your best e1RM in each session, oldest session first. `include` picks which working sets count.
function bestE1rmPerSession(sets, include) {
  const best = new Map();
  for (const s of sets)
    if (isWorkingSet(s) && include(s))
      best.set(s.sess, Math.max(best.get(s.sess) || 0, estimate1RM(s.w, s.r, s.rir)));
  return [...best.values()];
}

/* Strength = your best e1RM in each of your last 4 sessions, averaged with recent sessions counting more.
   Sets close to today's rep range (±3 reps) are preferred, so a heavy-triples day doesn't inflate a suggestion
   for a light day of 12s. Falls back to all working sets, and returns null with no history.
   `sets` must be sorted oldest first. */
function estimateStrength(sets, repsLo, repsHi) {
  const average = include => {
    const best = bestE1rmPerSession(sets, include).slice(-4);
    return best.length ? recencyWeightedAverage(best) : null;
  };
  return average(s => s.r >= repsLo - 3 && s.r <= repsHi + 3) ?? average(() => true);
}

/* How strong a lift has been lately compared with its longer-run level, at a similar rep count (±1):
   the last 3 sessions (recent ones counting more) against the plain average of the last 10.
   1.04 means 4% stronger than usual. Kept within ±10%. Used to nudge planned % sets. */
function strengthTrend(sets, reps) {
  const best = bestE1rmPerSession(sets, s => Math.abs(s.r - reps) <= 1);
  if (best.length < 2) return 1;
  const recent = recencyWeightedAverage(best.slice(-3));
  const longRun = best.slice(-10),
    mean = longRun.reduce((sum, x) => sum + x, 0) / longRun.length;
  return clamp(recent / mean, 0.9, 1.1);
}

// Working history: no warm-ups, oldest first.
const sortedHistory = history => history.filter(s => !s.wu).sort((a, b) => a.t - b.t);

/* The 1RM that % sets are based on: your tested 1RM if you have one, otherwise your estimated strength.
   Returns { w: kg (total load), est: true if estimated } or null when there's nothing to go on. */
function reference1RM(ex, testedPr, history) {
  if (testedPr) return { w: testedPr.w + bodyweightFor(ex), est: false };
  const sets = sortedHistory(history).map(s => withBodyweight(ex, s));
  const strength = estimateStrength(sets, -99, 999);
  return strength ? { w: Math.round(strength * 10) / 10, est: true } : null;
}

/* ---------- Suggestions for today's sets ----------
   Double progression: keep the weight and add a rep each session; past the top of the rep range, go heavier
   and start again at the bottom. Concretely, from the last session that had a working set in today's rep range:
     - reps you could do at today's target RIR = that set's reps + its RIR − target RIR; aim for one more,
     - but stay within what your averaged strength says you can do at that weight (between that and +2),
     - above the range: drop to the bottom of the range at a heavier weight (at least one step up),
     - below the range: bottom of the range at a lighter weight (at least one step down).
   With no set in range yet, the weight comes straight from your strength at the bottom of the range.
   Later sets aim for about one rep fewer every two sets, for fatigue. */

const fatigueReps = setIndex => Math.floor(setIndex / 2);

// n rows from makeRow(index). A plain loop on purpose: a set count that isn't a whole number (possible in an
// imported plan) rounds up, e.g. 2.5 -> 3 rows. Array.from({ length: n }) would round down.
function repeat(n, makeRow) {
  const out = [];
  for (let j = 0; j < n; j++) out.push(makeRow(j));
  return out;
}

// Aim one rep above last time, within [what the average says, average + 2].
const nextReps = (averageReps, lastTimeAtTarget) =>
  Math.min(averageReps + 2, Math.max(averageReps, Math.round(lastTimeAtTarget) + 1));

/* Suggested rows for `n` sets of `ex` (which carries today's target: lo–hi reps @ rir), from the exercise's
   full set history. Returns { rows: [{ w, r, rir }], hint: 'Last: … · 8–12 reps @ 2 RIR' }. */
function suggestSets(ex, n, history) {
  const sets = sortedHistory(history);
  const sessions = [...new Set(sets.map(s => s.sess))];
  const lastSession = sets.filter(s => s.sess == sessions[sessions.length - 1]);
  const hint = suggestionHint(ex, lastSession);
  const rows = (weight, reps) =>
    repeat(n, j => ({ w: weight, r: Math.max(ex.lo, reps - fatigueReps(j)), rir: ex.rir }));

  const bodyweightOnly = !(ex.inc > 0);
  const lastTimeAtBodyweight = !ex.bwl && lastSession.length && Math.max(...lastSession.map(s => s.w)) === 0;
  if (bodyweightOnly || lastTimeAtBodyweight) {
    const { weight, reps } = suggestReps(ex, sets, lastSession);
    return { rows: rows(weight, reps), hint };
  }

  const totals = sets.map(s => withBodyweight(ex, s));
  const strength = estimateStrength(totals, ex.lo, ex.hi);
  if (!strength) return { rows: repeat(n, () => ({ w: '', r: ex.lo, rir: ex.rir })), hint };

  // The heaviest working set in today's rep range, from the most recent session that has one.
  let lastInRange = null;
  for (let k = sessions.length - 1; k >= 0 && !lastInRange; k--)
    lastInRange =
      totals
        .filter(s => s.sess == sessions[k] && isWorkingSet(s) && s.r >= ex.lo && s.r <= ex.hi)
        .sort((a, b) => b.w - a.w || b.r - a.r)[0] || null;

  const weightAtBottomOfRange = roundToStep(strength * fractionOf1RM(ex.lo, ex.rir), ex.inc);
  let weight, reps;
  if (lastInRange) {
    const lastWeight = lastInRange.w;
    reps = nextReps(
      Math.round(repsAt(strength, lastWeight, ex.rir)),
      lastInRange.r + lastInRange.rir - ex.rir,
    );
    weight = lastWeight;
    if (reps > ex.hi) {
      reps = ex.lo;
      weight = Math.max(weightAtBottomOfRange, roundToStep(lastWeight + ex.inc, ex.inc));
    } else if (reps < ex.lo) {
      reps = ex.lo;
      weight = Math.min(weightAtBottomOfRange, roundToStep(lastWeight - ex.inc, ex.inc));
    }
  } else {
    reps = ex.lo;
    weight = weightAtBottomOfRange;
  }
  return { rows: rows(toLoadedWeight(ex, weight), reps), hint };
}

/* Bodyweight exercises (or ones you did at bodyweight last time) progress in reps only. "Capacity" is
   reps + RIR, the reps you could have done; it's averaged over the last 4 sessions like strength.
   Unlike isWorkingSet, sets at 0 kg count here (that's the point). */
function suggestReps(ex, sets, lastSession) {
  const capacity = new Map();
  for (const s of sets)
    if (!s.wu && s.rir != null && s.rir < 5 && (!(ex.inc > 0) || s.w === 0))
      capacity.set(s.sess, Math.max(capacity.get(s.sess) || 0, s.r + s.rir));
  const recent = [...capacity.values()].slice(-4);
  const lastBest = lastSession
    .filter(s => s.rir != null && s.rir < 5)
    .reduce((best, s) => Math.max(best, s.r + s.rir), 0);
  const weight = lastSession.length ? Math.max(...lastSession.map(s => s.w)) : '';
  let reps = ex.lo;
  if (recent.length) {
    const averageReps = Math.round(recencyWeightedAverage(recent) - ex.rir);
    reps = Math.max(ex.lo, lastBest ? nextReps(averageReps, lastBest - ex.rir) : averageReps + 1);
  }
  return { weight: weight || '', reps };
}

function suggestionHint(ex, lastSession) {
  const aim = `${ex.lo}–${ex.hi} reps @ ${ex.rir} RIR`;
  if (!lastSession.length) return `${aim} · no history yet`;
  const last = lastSession.map(
    s => `${weightLabel(s.w)}×${s.r}${s.rir != null ? ' @' + rirLabel(s.rir) : ''}`,
  );
  return `Last: ${last.join(', ')} · ${aim}`;
}

// Warm-up sets before the first working set: [fraction of the working weight, reps], by number of warm-ups.
const WARMUP_RAMP = {
  1: [[0.6, 5]],
  2: [
    [0.5, 8],
    [0.75, 4],
  ],
  3: [
    [0.45, 8],
    [0.65, 5],
    [0.85, 3],
  ],
  4: [
    [0.4, 8],
    [0.55, 5],
    [0.7, 3],
    [0.85, 2],
  ],
};

/* ---------- Adjusting the rest of the exercise after each set ----------
   After you log a set, the sets after it that you haven't edited adjust to how that set really went.
   They never move more than ±10% from the plan.
     % view:   the weights scale by today's strength compared with your usual strength at that rep count.
     RIR view: the weight stays and the reps move to hit the target RIR, unless they'd leave the rep range,
               in which case the reps go to the edge of the range and the weight moves instead.
               Each following set assumes you're about 1.5% weaker, for fatigue.
   Rows: { w, r, rir, pw: planned weight (total load), auto: true until you edit it, done, wu, adj: adjusted }. */

// A logged set (in total load) that can tell us today's strength. Deliberately not the same test as
// isWorkingSet (that one is for history): here the RIR must be 0–5 and the exercise must use weights.
const canAdjustFrom = (logged, ex) =>
  !(+logged.rir > 5 || logged.wu || !(+logged.w > 0) || !hasRir(logged) || !(+logged.r > 0) || !(ex.inc > 0));

// % view. `history` is the exercise's logged sets; sets from `currentSession` (today) are left out of "usual".
function adjustRemainingSetsPct(item, j, ex, history, currentSession) {
  const logged = withBodyweight(ex, item.rows[j]);
  if (!canAdjustFrom(logged, ex)) return;
  const today = estimate1RM(+logged.w, +logged.r, +logged.rir);

  // Usual strength at this rep count (±1): best e1RM of each of the last 4 sessions, recent ones counting more.
  const best = new Map(); // session -> [time, best e1RM]
  for (const s of history.map(s => withBodyweight(ex, s)))
    if (s.sess != currentSession && isWorkingSet(s) && Math.abs(s.r - logged.r) <= 1)
      best.set(s.sess, [s.t, Math.max(best.get(s.sess)?.[1] || 0, estimate1RM(s.w, s.r, s.rir))]);
  const recent = [...best.values()]
    .sort((a, b) => a[0] - b[0])
    .slice(-4)
    .map(x => x[1]);
  let usual = null;
  if (recent.length) usual = recencyWeightedAverage(recent);
  else {
    // No history at this rep count yet: compare with today's first comparable set.
    const first = item.rows.find(
      r => r.done && !r.wu && +withBodyweight(ex, r).w > 0 && hasRir(r) && Math.abs(+r.r - logged.r) <= 1,
    );
    if (first && first !== item.rows[j]) {
      const f = withBodyweight(ex, first);
      usual = estimate1RM(+f.w, +f.r, +f.rir);
    }
  }
  if (!usual) return;

  const factor = clamp(today / usual, 0.9, 1.1);
  for (let q = j + 1; q < item.rows.length; q++) {
    const row = item.rows[q];
    if (row.done || row.wu || !row.auto || !(+row.pw > 0)) continue;
    const w = toLoadedWeight(ex, row.pw * factor);
    if (w !== row.w) {
      row.w = w;
      row.adj = true;
    }
  }
}

// RIR view.
function adjustRemainingSetsRir(item, j, ex) {
  if (item.mode == 'pct') return;
  const logged = withBodyweight(ex, item.rows[j]);
  if (!canAdjustFrom(logged, ex)) return;
  const today = estimate1RM(+logged.w, +logged.r, +logged.rir);

  let setsAhead = 0;
  for (let q = j + 1; q < item.rows.length; q++) {
    const row = item.rows[q];
    if (row.done || row.wu || !row.auto || !(+row.r > 0) || !hasRir(row)) continue;
    const strength = today * Math.pow(0.985, ++setsAhead); // about 1.5% weaker per set, for fatigue
    const planned = +row.pw || +row.w || 0;
    const withinPlan = w =>
      planned > 0
        ? Math.min(roundToStep(planned * 1.1, ex.inc), Math.max(roundToStep(planned * 0.9, ex.inc), w))
        : w;
    const weightFor = reps => withinPlan(roundToStep(strength * fractionOf1RM(reps, +row.rir), ex.inc));

    const weightBefore = +withBodyweight(ex, row).w || 0;
    let weight = weightBefore,
      reps = +row.r;
    if (!(weight > 0)) weight = weightFor(reps);
    else {
      reps = Math.round(repsAt(strength, weight, +row.rir));
      if (reps > item.hi) {
        reps = item.hi;
        weight = weightFor(reps);
      } else if (reps < item.lo) {
        reps = item.lo;
        weight = weightFor(reps);
      }
    }
    if (reps !== +row.r || weight !== weightBefore) {
      row.r = reps;
      if (weight !== weightBefore) row.w = toLoadedWeight(ex, weight);
      row.adj = true;
    }
  }
}

/* ---------- What to show under a set ----------
   The set's e1RM and how it compares with your tested 1RM (`testedPr`, or undefined).
   Returns { s: text, w: 1 when the set suggests your 1RM is out of date (e1RM more than 3% above it) }. */
function setInfo(row, ex, testedPr) {
  const bw = bodyweightFor(ex),
    pr = testedPr && { ...testedPr, w: testedPr.w + bw };
  if (row.wu) return { s: 'Warm-up', w: 0 };
  const set = bw ? withBodyweight(ex, row) : row;
  if (+row.rir > 5 && row.rir !== '') return { s: '5+: not used for suggestions', w: 0 };
  if (!(set.w > 0 && set.r > 0 && hasRir(set))) return { s: '', w: 0 };
  const vs1RM = d => ` · ${d >= 0 ? '+' : ''}${d.toFixed(1)}% vs 1RM`;
  if (isMaxTest(set)) {
    let s = 'Counts as a 1RM';
    if (pr) s += vs1RM((set.w / pr.w - 1) * 100);
    return { s, w: 0 };
  }
  const e = estimate1RM(set.w, set.r, set.rir);
  let s = 'e1RM ' + fmt(e);
  if (pr) {
    const d = (e / pr.w - 1) * 100;
    s += vs1RM(d);
    if (d > 3) return { s: '⚠ ' + s, w: 1 };
  }
  return { s, w: 0 };
}
/* App state, loading data, plans, and building a workout.
 *
 * Data model (field names are short because they're stored on the phone and in backups; don't rename them)
 *   exercise   { id, name, mode: 'rir'|'pct' (last used), inc: weight step (0 = bodyweight only),
 *                lo, hi: rep range and rir: target RIR for quick workouts, wu: warm-up sets (0–4),
 *                pb: lifetime best kg, bwl: true if the load includes bodyweight }
 *   set        { id, exId, sess: workout id (its start time), t: time logged, w: kg, r: reps, rir: RIR or null,
 *                test: 1-rep max test, wu: warm-up, bw: bodyweight then, wn: workout name, pd: 'planId:dayIndex' }
 *   pr_history { id, exId, w: tested 1RM in kg, t: date, setId }   (the latest one is your current 1RM)
 *   template   a plan: { id, name, weeks, active, runStart, days: [{ name, items: [slot] }] }
 *     slot     RIR:  { exId, mode: 'rir', n: sets, lo, hi, rirW: [target RIR for week 1, week 2, …] }
 *              %1RM: { exId, mode: 'pct', lines: [{ n: sets, r: reps, p: % of 1RM }] }
 *   workout    the workout in progress (kept in localStorage):
 *              { sess, name, pd, rest: rest seconds, restEnd: when the timer ends, items: [item] }
 *     item     one exercise: { exId, mode, lo, hi, rirT: target RIR, rows: [row], hint, bwo: bodyweight added,
 *                ref: reference 1RM for % view, refEst: true if ref is an estimate }
 *     row      one set: { w, r, rir, pw: planned weight (total load), auto: untouched by you, done, id: logged set,
 *                wu: warm-up, adj: adjusted after an earlier set }
 */

// state.tab: the bottom-bar tab. state.view: a page open on top of it ({ t: 'exd' | 'tple' | 'wed' | 'set' }).
// state.prl / state.hist: tested 1RMs and logged sets of the exercise whose page is open.
let state = { tab: 'train', view: null, ex: [], tpl: [], pr: {}, prl: [], hist: [] },
  draft = null, // a copy of the exercise or plan being edited, saved only when you tap Save
  workout = null; // the workout in progress (see the data model above)
try {
  workout = JSON.parse(localStorage.getItem(LS_PREFIX + 'w') || 'null');
} catch {}

  try {
    localStorage.setItem(LS_PREFIX + 'w', JSON.stringify(workout));
  } catch {}
};
const exerciseById = id => state.ex.find(e => e.id == id);

async function loadState() {
  state.ex = await getAll('exercises');
  state.tpl = await getAll('templates');
  state.sets = await getAll('sets');
  state.pr = {};
  state.tpl.forEach(upgradeOldPlan);
  // state.pr[exerciseId] = the latest tested 1RM
  (await getAll('pr_history')).sort((a, b) => a.t - b.t).forEach(p => (state.pr[p.exId] = p));
}

/* ---------- Plans ---------- */

// Older versions stored plans differently; bring them up to date in memory (saved on the next Save).
function upgradeOldPlan(t) {
  if (!t.weeks) t.weeks = 8;
  if (!t.days) {
    t.days = [{ name: 'Day 1', items: t.items || [] }];
    delete t.items;
  }
  for (const d of t.days)
    for (const it of d.items) {
      if (!it.mode) it.mode = exerciseById(it.exId)?.mode == 'pct' ? 'pct' : 'rir';
      if (it.mode == 'pct' && !it.lines?.length) {
        it.lines = linesFromText(it.text);
        if (!it.lines.length) it.lines = [newPctLine()];
      }
    }
}

// Old plans stored % sets as text like "3*80%x5"; turn those into lines.
function linesFromText(text) {
  const out = [];
  for (const l of String(text || '').split('\n')) {
    const m = l.trim().match(/^(?:(\d+)\s*[*×]\s*)?(\d+(?:\.\d+)?)%\s*x\s*(\d+)$/i);
    if (m) out.push({ n: +(m[1] || 1), p: +m[2], r: +m[3] });
  }
  return out;
}

// New plan slots and quick adds start in the tracking mode you used last for that exercise.
const rememberTrackingMode = async (ex, mode) => {
  if (ex && ex.mode != mode) {
    ex.mode = mode;
    await dbPut('exercises', ex);
  }
};
const newPctLine = () => ({ n: 3, r: 3, p: 75 });

// A RIR slot's target RIR for each week of the plan, padded with the last value (or the default).
const weeklyRirTargets = (it, weeks, ex) => {
  const targets = Array.isArray(it.rirW) ? it.rirW.slice(0, weeks) : [],
    fill = targets.length ? targets[targets.length - 1] : (it.rir ?? ex?.rir ?? 2);
  while (targets.length < weeks) targets.push(fill);
  return targets;
};

/* Where you are in a plan, counted from the workouts logged since you started it.
   { total: plan days done, need: total days in the plan, done, wk: current week,
     wdays: day indexes done this week, nx: index of the next day } */
function planProgress(t) {
  const daysPerWeek = t.days.length,
    dayOfSession = new Map();
  state.sets
    .filter(s => s.pd && s.pd.startsWith(t.id + ':') && s.sess >= t.runStart)
    .sort((a, b) => a.t - b.t)
    .forEach(s => {
      if (!dayOfSession.has(s.sess)) dayOfSession.set(s.sess, +s.pd.split(':')[1]);
    });
  const days = [...dayOfSession.values()],
    total = days.length,
    need = t.weeks * daysPerWeek,
    weeksDone = Math.floor(total / daysPerWeek);
  return {
    total,
    need,
    done: total >= need,
    wk: Math.min(weeksDone + 1, t.weeks),
    wdays: new Set(days.slice(weeksDone * daysPerWeek)),
    nx: total ? (days[total - 1] + 1) % daysPerWeek : 0,
  };
}

/* ---------- Building a workout ---------- */

// The 1RM % sets are based on, for an exercise (see reference1RM in training.js).
async function loadReference1RM(ex) {
  const tested = state.pr[ex.id];
  return reference1RM(ex, tested, tested ? [] : await getAll('sets', 'ex', ex.id)); // history only needed without a test
}

/* Add an exercise to the workout in progress, with its sets filled in.
   `slot` is a plan slot (or { exId, n } for a quick add); `week` is the plan week, which picks the target RIR.
   RIR slots get suggested weight and reps. % slots get the plan's % of your reference 1RM, nudged (max ±10%)
   by how strong you've been lately at that rep count. Warm-ups, if the exercise has them, go first. */
async function addExerciseToWorkout(slot, week = 1) {
  const ex = exerciseById(slot.exId);
  if (!ex) return;
  const history = await getAll('sets', 'ex', ex.id); // this exercise's logged sets
  const orDefault = (value, fallback) => (value === '' || value == null ? fallback : value),
    mode = slot.mode || (ex.mode == 'pct' ? 'pct' : 'rir'),
    lo = orDefault(slot.lo, ex.lo) || 5,
    hi = orDefault(slot.hi, ex.hi) || Math.max(lo, 8),
    targetRir =
      Array.isArray(slot.rirW) && slot.rirW.length
        ? +slot.rirW[Math.min(week, slot.rirW.length) - 1]
        : (orDefault(slot.rir, ex.rir) ?? 2),
    plannedPct = mode == 'pct' && slot.lines?.length,
    item = { exId: ex.id, mode, lo, hi, rirT: targetRir, rows: [], hint: '', bwo: bodyweightFor(ex) },
    suggestion = suggestSets({ ...ex, lo, hi, rir: targetRir }, plannedPct ? 0 : slot.n || 3, history);
  item.hint = suggestion.hint;
  if (mode == 'pct') {
    const ref = reference1RM(ex, state.pr[ex.id], history);
    item.ref = ref?.w;
    item.refEst = ref?.est;
  }

  if (plannedPct) {
    const totals = sortedHistory(history).map(s => withBodyweight(ex, s));
    let nudge = 0;
    for (const line of slot.lines) {
      const reps = Math.max(1, Math.round(+line.r || 1)),
        trend = strengthTrend(totals, reps),
        planned = item.ref ? ((+line.p || 0) / 100) * item.ref : 0;
      if (trend !== 1) nudge = trend;
      for (let k = 0; k < Math.max(1, Math.round(+line.n || 1)); k++)
        item.rows.push({
          w: planned > 0 ? toLoadedWeight(ex, planned * trend) : '',
          r: reps,
          rir: '',
          pw: planned,
          auto: true,
        });
    }
    // Hint: the nudge, then what you did last time (without the RIR target, which doesn't apply here).
    const last = (item.hint || '').startsWith('Last:')
      ? item.hint.replace(/ · \d+–\d+ reps @ [\d.]+ RIR$/, '')
      : '';
    item.hint = [
      nudge ? `${nudge > 1 ? '+' : ''}${Math.round((nudge - 1) * 100)}% vs plan from recent sessions` : '',
      last,
    ]
      .filter(Boolean)
      .join(' · ');
  } else item.rows = suggestion.rows.map(r => ({ ...r, pw: (+r.w || 0) + item.bwo, auto: true }));

  if (!item.rows.length) item.rows.push({ w: '', r: '', rir: '' });
  const warmups = Math.min(4, Math.max(0, Math.round(+ex.wu || 0)));
  if (warmups) {
    const working = +item.rows[0].w || 0;
    item.rows.unshift(
      ...WARMUP_RAMP[warmups].map(([fraction, reps]) => ({
        w: working && ex.inc > 0 ? roundToStep(working * fraction, ex.inc) : '',
        r: reps,
        rir: '',
        wu: true,
      })),
    );
  }
  workout.items.push(item);
}

// Start a workout: a plan day (planId, dayIndex) or a quick workout (no planId).
async function startWorkout(planId, day = 0) {
  picker = null;
  showTrainHome = false;
  const plan = planId ? state.tpl.find(x => x.id == planId) : null,
    planDay = plan && plan.days[day];
  workout = {
    sess: Date.now(),
    name: planDay ? `${plan.name} · ${planDay.name}` : 'Quick workout',
    pd: planDay ? `${plan.id}:${day}` : undefined,
    rest: +lsGet('rest') || 120,
    restEnd: 0,
    items: [],
  };
  if (planDay) {
    const week = planProgress(plan).wk;
    for (const slot of planDay.items) await addExerciseToWorkout(slot, week);
  }
  saveWorkout();
  render();
}
/* Rest timer between sets. It starts when you log a set, beeps and vibrates when time's up, and survives
   closing the app (the end time is saved with the workout). The bar at the bottom of the workout screen. */
let audioCtx,
  alarmedAt = 0;
const clockText = x => Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0');
function restText() {
  const rem = workout.restEnd ? workout.restEnd - Date.now() : 0;
  return workout.restEnd && rem <= 0
    ? 'Go!'
    : clockText(workout.restEnd ? Math.ceil(rem / 1000) : workout.rest);
}
function restClass() {
  return 'rt' + (workout.restEnd ? (workout.restEnd - Date.now() > 0 ? ' run' : ' go') : '');
}
const restBarWidth = () => {
  const rem = workout.restEnd ? workout.restEnd - Date.now() : 0;
  return rem > 0 ? Math.min(100, (rem / (workout.rest * 1000)) * 100).toFixed(1) + '%' : '0%';
};
const elapsedText = () => {
  const x = Math.floor((Date.now() - workout.sess) / 1000);
  return x >= 0 && x < 21600 ? clockText(x) : '';
};
const restTimerBar = () =>
  `<div class=rest><div class=rb><i id=rbi style="width:${restBarWidth()}"></i></div><div class=rr><button class=s data-a=rdec>−15</button><button id=rt class="${restClass()}" data-a=redit>${restText()}</button><button class=s data-a=rinc>+15</button><button class=s data-a=rstop aria-label="Stop timer">✕</button></div></div>`;
function startRest() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume?.();
  } catch {}
  workout.restEnd = Date.now() + (workout.rest || 120) * 1000;
  saveWorkout();
}
function alarm() {
  try {
    navigator.vibrate?.([250, 120, 250]);
  } catch {}
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(),
      g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.25;
    o.start();
    o.stop(audioCtx.currentTime + 0.6);
  } catch {}
}
function setRest(n) {
  n = Math.min(1800, Math.max(15, n));
  const d = n - workout.rest;
  workout.rest = n;
  if (workout.restEnd && workout.restEnd > Date.now()) workout.restEnd += d * 1000;
  lsSet('rest', n);
  saveWorkout();
  tickRest();
}
function tickRest() {
  if (!workout) return;
  if (workout.restEnd) {
    const rem = workout.restEnd - Date.now();
    if (rem <= 0 && rem > -4000 && alarmedAt !== workout.restEnd) {
      alarmedAt = workout.restEnd;
      alarm();
    }
  }
  const b = $('#rt');
  if (b) {
    b.textContent = restText();
    b.className = restClass();
  }
  const bi = $('#rbi');
  if (bi) bi.style.width = restBarWidth();
  const el = $('#el');
  if (el) el.textContent = elapsedText();

/* Type-to-find exercises, used when adding or replacing an exercise in a workout, a plan or a past workout.
   Empty search: your most-used exercises as chips. While typing: matches ranked by where the text matches,
   with "New exercise" at the end when nothing matches exactly. */

const exercisesByName = () =>
  state.ex.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
/* ---------- type-to-find exercises (like Home log): most-used chips when empty, ranked matches while typing ---------- */
let planAddSearch = { k: null, q: '' },
  pickerShowAll = false,
  planReplace = null; // TR: plan item being replaced {k,j,q}   // plan-editor search (day index + text); picker "show all" toggle
function matchExercises(q, skip) {
  const u = {};
  for (const x of state.sets) u[x.exId] = (u[x.exId] || 0) + 1;
  const l = state.ex.filter(e => e.id != skip),
    nm = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  q = q.trim().toLowerCase();
  if (!q)
    return [
      ...l.filter(e => u[e.id]).sort((a, b) => u[b.id] - u[a.id] || nm(a, b)),
      ...l.filter(e => !u[e.id]).sort(nm),

  };
  return l
    .map(e => [e, tier(e)])
    .filter(x => x[1] < 9)
    .sort((a, b) => a[1] - b[1] || (u[b[0].id] || 0) - (u[a[0].id] || 0) || nm(a[0], b[0]))
    .slice(0, 8)

}

function groupSessions(sets) {

  return Object.keys(g)
    .map(k => {
      const ss = g[k].sort((a, b) => a.t - b.t),
        es = ss.filter(s => s.rir != null && !s.test).map(s => estimate1RM(s.w, s.r, s.rir));
      return {
        k: +k,
        t: ss[0].t,
        ss,
        vol: ss.reduce((a, s) => a + s.r, 0),
        top: ss.reduce((a, b) => (b.w > a.w ? b : a)),

function lineChart(l, v, t, z, u = '') {

  return `<div class=m style="margin-top:12px">${l}</div><svg class=chart viewBox="0 0 300 124" width="100%" role=img aria-label="${l}: from ${fmt(v[0])} to ${fmt(v[v.length - 1])}" data-u="${u}" data-p="${v.map((y, i) => X(i) + '|' + Y(y) + '|' + y + '|' + t[i]).join(';')}"><g fill="var(--m)" font-size="10" font-family="Bw,system-ui,sans-serif"><text x="${L - 5}" y="${T + 3}" text-anchor="end">${fmt(mx)}</text><text x="${L - 5}" y="${B + 3}" text-anchor="end">${fmt(mn)}</text><text x="${L}" y="118">${d(t[0])}</text><text x="${Rr}" y="118" text-anchor="end">${d(t[t.length - 1])}</text></g>
 <path d="M${L} ${T}V${B}H${Rr}" fill="none" stroke="var(--m)" stroke-width="1" opacity=".6"/><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>
 <g class=tip visibility=hidden><line y1="${T}" y2="${B}" stroke="var(--fg)" stroke-width="1" opacity=".35"/><circle r="4" fill="var(--ac)" stroke="var(--c)" stroke-width="2"/><rect rx="5" fill="var(--c2)"/><text font-size="11" font-weight="600" fill="var(--fg)" text-anchor="middle" font-family="Bw,system-ui,sans-serif"></text></g></svg>`;
}
// Touch, drag or hover on a chart: mark the nearest session and show its date and value.
function showChartTip(e) {
  const sv = e.target.closest?.('svg.chart');
  if (!sv) {
    if (e.type == 'pointerdown')
      document.querySelectorAll('svg.chart .tip').forEach(g => g.setAttribute('visibility', 'hidden'));
    return;
  }
  const r = sv.getBoundingClientRect(),
    x = ((e.clientX - r.left) / r.width) * 300,
    pts = sv.dataset.p.split(';').map(p => p.split('|').map(Number));
  let b = pts[0];
  for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(b[0] - x)) b = p;
  const [px, py, val, t] = b,
    g = sv.querySelector('.tip'),
    tx = g.querySelector('text'),
    rc = g.querySelector('rect'),
    u = sv.dataset.u;
  g.querySelector('line').setAttribute('x1', px);
  g.querySelector('line').setAttribute('x2', px);
  const c = g.querySelector('circle');
  c.setAttribute('cx', px);
  c.setAttribute('cy', py);
  tx.textContent = `${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: '2-digit' })} · ${u == 'kg' && !(val > 0) ? 'BW' : fmt(val) + (u ? ' ' + u : '')}`;
  g.setAttribute('visibility', 'visible');
  const w = tx.getComputedTextLength() + 14,
    cx = Math.min(300 - w / 2 - 2, Math.max(w / 2 + 2, px)),
    cy = py < 30 ? py + 22 : py - 12;
  tx.setAttribute('x', cx);
  tx.setAttribute('y', cy + 4);
  rc.setAttribute('x', cx - w / 2);
  rc.setAttribute('y', cy - 9);
  rc.setAttribute('width', w);
  rc.setAttribute('height', 18);
}

async function saveEditedWorkout() {
  for (const it of editedWorkout.items)
    for (const r of it.rows) {
      if (!(+r.r > 0))
        return toast(
          `Enter reps for every set of ${exerciseById(it.exId)?.name || 'each exercise'}, or remove the set`,
        );
      if (r.rir !== '' && !(+r.rir >= 0 && +r.rir <= 10))
        return toast('RIR must be between 0 and 10, or empty');
    }
  const old = state.sets.filter(s => s.sess == editedWorkout.sess),
    o = new Date(editedWorkout.sess),
    [y, mo, da] = (editedWorkout.date || dayKey(editedWorkout.sess)).split('-').map(Number),
    sess = new Date(
      y,
      mo - 1,
      da,
      o.getHours(),
      o.getMinutes(),
      o.getSeconds(),
      o.getMilliseconds(),
    ).getTime(),
    dt = isFinite(sess) ? sess - editedWorkout.sess : 0,
    ns = editedWorkout.sess + dt,
    keep = new Set(editedWorkout.items.flatMap(i => i.rows.map(r => r.id).filter(Boolean))),
    pd = old.find(s => s.pd)?.pd,
    wn = editedWorkout.wn.trim().slice(0, 100) || 'Workout';
  let tmax = Math.max(ns, ...old.map(s => s.t + dt));
  for (const s of old) if (!keep.has(s.id)) await dbDelete('sets', s.id);
  for (const it of editedWorkout.items)
    for (const r of it.rows) {
      const rir = r.rir === '' ? null : +r.rir,
        rec = {
          ...(r.src || {}),
          exId: it.exId,
          sess: ns,
          wn,
          t: r.src ? r.src.t + dt : (tmax += 1000),
          w: +r.w || 0,
          r: Math.round(+r.r),
          rir,
          test: !r.wu && +r.r === 1 && rir === 0,
        };
      if (pd) rec.pd = pd;
      else delete rec.pd;
      if (r.wu) rec.wu = true;
      else delete rec.wu;
      await dbPut('sets', rec);
    }
  editedWorkout = null;
  state.view = null;
  if (calendar) calendar.sel = dayKey(ns);
  await loadState();
  render();
  toast('Workout saved');
}

      dy = t.clientY - swipeY;
    if (swipeState == 1) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
        swipeState = 0;
        return;
      }
      if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      swipeState = 2;
    }
    const i = TAB_ORDER.indexOf(state.tab),
      j = i + (dx < 0 ? 1 : -1),
      ok = j >= 0 && j < TAB_ORDER.length,
      m = $('main');
    if (!m) return;
    const k = Math.min(1, Math.abs(dx) / SWIPE_DISTANCE);
    swipeDx = ok ? dx : 0;
    m.style.transform = `translateX(${dx * (ok ? 0.55 : 0.15)}px)`;
    m.style.opacity = ok ? 1 - 0.35 * k : 1;
    document
      .querySelectorAll('nav button')
      .forEach((x, n) => x.classList.toggle('nx', ok && n == j && k >= 1));
    const h = swipeHint();
    if (ok) {
      h.textContent = (dx < 0 ? '' : '‹ ') + TAB_NAMES[TAB_ORDER[j]] + (dx < 0 ? ' ›' : '');
      h.className = (dx < 0 ? 'r ' : 'l ') + (k >= 1 ? 'go' : '');
      h.style.opacity = Math.min(1, k * 1.4);
    } else h.style.opacity = 0;
  },
  { passive: true },
);
document.addEventListener(
  'touchend',
  e => {
    if (swipeState != 2) {
      swipeState = 0;
      return;
    }
    const dx = swipeDx,
      i = TAB_ORDER.indexOf(state.tab),
      j = i + (dx < 0 ? 1 : -1);
    if (Math.abs(dx) >= SWIPE_DISTANCE && j >= 0 && j < TAB_ORDER.length) {
      $('#sh')?.remove();
      swipeState = 0;
      slideDir = dx < 0 ? 1 : -1;
      actions.tab(null, { i: TAB_ORDER[j] });
    } else endSwipe();
  },
  { passive: true },
);
document.addEventListener('touchcancel', endSwipe, { passive: true });

  upd: async () => {
    const b = $('#updb'); // ask the server which version it serves (sw.js carries the same VER); update on demand
    b.textContent = 'Checking…';
    b.disabled = true;
    let v = null;
    try {
      const r = await fetch('sw.js?check=' + Date.now(), { cache: 'no-store' });
      if (r.ok) v = (/const VER='(\d+\.\d+)';/.exec(await r.text()) || [])[1] || null;
    } catch {}
    b.textContent = 'Check for updates';
    b.disabled = false;
    if (!v) return toast("Couldn't reach the server. Check the connection and try again.");
    const n = x => x.split('.').map(Number),
      [a1, a2] = n(v),
      [c1, c2] = n(VER);
    if (a1 < c1 || (a1 == c1 && a2 <= c2)) return toast(`You're on the latest version (v${VER}).`);
    if (!confirm(`Version v${v} is available (you have v${VER}). Update now?`)) return;
    b.textContent = 'Updating…';
    b.disabled = true;
    try {
      const g = await navigator.serviceWorker?.getRegistration();
      if (g) await g.update();
    } catch {}
    try {
      for (const k of await caches.keys())
        if (k.startsWith('lift-log-') || k.startsWith('liftlog-')) await caches.delete(k);
    } catch {} // only this app's caches
    location.reload();
  },

  log: async s => {
    const it = workout.items[s.dataset.i],
      r = it.rows[s.dataset.j],
      ex = exerciseById(it.exId);
    if (!(r.r > 0)) return toast('Enter reps'); // empty or 0 weight = bodyweight (BW)
    if (r.rir !== '' && r.rir != null && !(+r.rir >= 0 && +r.rir <= 10))
      return toast(
        it.mode == 'pct'
          ? "RPE must be between 0 and 10. Leave it blank if you don't track it."
          : "RIR must be between 0 and 10. Leave it blank if you don't track it.",
      );
    const test = !r.wu && isMaxTest(r);
    const rec = {
      exId: ex.id,
      sess: workout.sess,
      wn: workout.name,
      pd: workout.pd,
      t: Date.now(),
      w: Math.round((+r.w || 0) * 100) / 100,
      r: r.r,
      rir: hasRir(r) ? +r.rir : null,
      test,
    };
    if (r.wu) rec.wu = true;
    if (ex.bwl && bodyweight()) rec.bw = bodyweight();
    r.id = await dbPut('sets', rec);
    r.done = true;
    delete r.adj;
    if (it.mode == 'pct') {
      // Read the history only when this set can tell us anything (not a warm-up, 5+ or without weight).
      if (canAdjustFrom(withBodyweight(ex, r), ex))
        await adjustRemainingSetsPct(it, +s.dataset.j, ex, await getAll('sets', 'ex', ex.id), workout.sess);
    } else adjustRemainingSetsRir(it, +s.dataset.j, ex);
    saveWorkout();
    startRest();
    const x = setInfo(r, ex, state.pr[ex.id]),
      pr = state.pr[ex.id];
    if (test) {
      const pb = ex.pb || 0,
        beat = r.w > pb;
      if (beat) await dbPut('exercises', { ...ex, pb: r.w });
      if (
        confirm(
          `Save ${fmt(r.w)} as your current 1RM for ${ex.name}?` +
            (pr ? `\nCurrent 1RM: ${fmt(pr.w)} (tested ${ageText(pr.t)})` : '') +
            (beat ? '\nNew lifetime PB!' : ''),

      )
        await dbPut('pr_history', { exId: ex.id, w: r.w, t: rec.t, setId: r.id });

        for (const l of it.lines || []) {

          l.p = +l.p;
          delete l.rpe;
          if (!(l.n >= 1 && l.n <= 20 && l.r >= 1 && l.r <= 50 && l.p > 0 && l.p <= 150))
            return toast(`Check the % lines for ${nm}: sets 1–20, reps 1–50, % up to 150`);
        }
      }
    }
    await dbPut('templates', draft);
    await loadState();
    closePage();
  },
  tplDel: async () => {
    if (confirm('Delete this plan?')) {
      await dbDelete('templates', draft.id);
      await loadState();
      closePage();
    }
  },
};
/* Backups. Manual: export everything to a JSON file and import it back (validated field by field).
   Automatic: a few seconds after each change, the same file is saved to a private GitHub repo. */

function lastBackupTime() {
  try {
    return +localStorage.getItem(LS_PREFIX + 'lb') || 0;
  } catch {
    return 0;
  }
}
/* ---------- backup ---------- */
const STORES = ['exercises', 'templates', 'pr_history', 'sets'];
async function exportData() {
  const d = { app: 'liftlog', v: 1, t: Date.now() };
  for (const n of STORES) d[n] = await getAll(n);
  d.bw = bodyweight() || undefined;
  d.ht = height() || undefined;
  const name = `liftlog-${new Date().toISOString().slice(0, 10)}.json`,
    f = new File([JSON.stringify(d)], name, { type: 'application/json' });
  try {
    if (navigator.canShare?.({ files: [f] })) await navigator.share({ files: [f] });
    else throw 0;
  } catch (e) {
    if (e && e.name == 'AbortError') return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = name;
    a.click();
  }
  try {
    localStorage.setItem(LS_PREFIX + 'lb', Date.now());
  } catch {}
  toast('Backup exported');
  render();
}
/* ---------- import validation: rebuild every record from known fields only ---------- */
function sanitizeBackup(d) {
  const num = (x, k) => {
      if (typeof x != 'number' || !isFinite(x)) throw new Error('bad ' + k);
      return x;
    },
    opt = x => (typeof x == 'number' && isFinite(x) ? x : undefined),
    str = (x, k) => {
      if (typeof x != 'string' || x.length > 200) throw new Error('bad ' + k);
      return x;
    },
    arr = (o, n, max = 2e5) => {
      if (!Array.isArray(o[n]) || o[n].length > max) throw new Error('bad ' + n);
      return o[n];
    };
  return {
    t: opt(d.t) ?? Date.now(),
    bw: opt(d.bw),
    ht: opt(d.ht),
    exercises: arr(d, 'exercises').map(e => {
      if (!['rir', 'pct'].includes(e.mode)) throw new Error('bad mode');
      return {
        id: num(e.id, 'id'),
        name: str(e.name, 'name'),
        mode: e.mode,
        inc: num(e.inc, 'inc'),
        lo: opt(e.lo),
        hi: opt(e.hi),
        rir: opt(e.rir),
        pb: opt(e.pb),
        wu: opt(e.wu),
        bwl: e.bwl === true ? true : undefined,
      };
    }),
    templates: arr(d, 'templates').map(t => ({
      id: num(t.id, 'id'),
      name: str(t.name, 'name'),
      weeks: opt(t.weeks),
      active: t.active === true,
      runStart: opt(t.runStart),
      days: arr(Array.isArray(t.days) ? t : { days: [{ name: 'Day 1', items: t.items }] }, 'days', 14).map(
        y => ({
          name: str(y.name, 'name'),
          items: arr(y, 'items', 200).map(i => ({
            exId: num(i.exId, 'exId'),
            n: opt(i.n),
            lo: opt(i.lo),
            hi: opt(i.hi),
            rir: opt(i.rir),
            mode: i.mode == 'pct' ? 'pct' : i.mode == 'rir' ? 'rir' : undefined,
            lines: Array.isArray(i.lines)
              ? arr(i, 'lines', 20).map(l => ({ n: opt(l.n), r: opt(l.r), p: opt(l.p) }))
              : undefined,
            rirW: Array.isArray(i.rirW) ? arr(i, 'rirW', 60).map(v => opt(v) ?? 2) : undefined,
            text: typeof i.text == 'string' ? i.text.slice(0, 2000) : undefined,
          })),
        }),
      ),
    })),
    pr_history: arr(d, 'pr_history').map(p => ({
      id: num(p.id, 'id'),
      exId: num(p.exId, 'exId'),
      w: num(p.w, 'w'),
      t: num(p.t, 't'),
      setId: opt(p.setId),
    })),
    sets: arr(d, 'sets').map(s => ({
      id: num(s.id, 'id'),
      exId: num(s.exId, 'exId'),
      sess: num(s.sess, 'sess'),
      t: num(s.t, 't'),
      w: num(s.w, 'w'),
      r: num(s.r, 'r'),
      rir: s.rir == null ? null : num(s.rir, 'rir'),
      test: s.test === true,
      wu: s.wu === true ? true : undefined,
      bw: opt(s.bw),
      wn: typeof s.wn == 'string' ? s.wn.slice(0, 100) : undefined,
      pd: typeof s.pd == 'string' && /^\d+:\d+$/.test(s.pd) ? s.pd : undefined,
    })),
  };
}
async function importData(f) {
  if (!f) return;
  let d;
  try {
    d = JSON.parse(await f.text());
    if (d.app != 'liftlog' || !STORES.every(n => Array.isArray(d[n]))) throw 0;
  } catch {
    return toast('Not a Lift Log backup file');
  }
  await applyBackup(d);
}
async function applyBackup(d) {
  try {
    d = sanitizeBackup(d);
  } catch (e) {
    toast('Backup file is invalid (' + e.message + '). Nothing was changed.');
    return false;
  }
  if (
    !confirm(
      `Replace ALL current data with the backup from ${dateText(d.t)}? (${d.sets.length} sets, ${d.exercises.length} exercises)`,
    )
  )
    return false;
  for (const n of STORES) {
    await request(store(n, 'readwrite').clear());
    for (const o of d[n]) await dbPut(n, o);
  }
  if (d.bw > 0) lsSet('bw', d.bw);
  if (d.ht >= 100 && d.ht <= 250) lsSet('ht', d.ht);
  workout = null;
  saveWorkout();
  state.view = null;
  draft = null;
  await loadState();
  render();
  toast('Backup restored');
  return true;
}

/* ---------- automatic backup to a private GitHub repo ---------- */
const githubConfig = () => {
  try {
    return JSON.parse(lsGet('gh') || 'null');
  } catch {
    return null;
  }
};
const githubFileUrl = g => `https://api.github.com/repos/${g.repo}/contents/liftlog-backup.json`;
const githubHeaders = (g, a = 'application/vnd.github+json') => ({
  Authorization: 'Bearer ' + g.token,
  Accept: a,
});
let backupTimer;
function markDataChanged() {
  lsSet('dirty', '1');
  clearTimeout(backupTimer);
  backupTimer = setTimeout(autoBackup, 15000);
}
let pushQueue = Promise.resolve();
const githubPush = g =>
  (pushQueue = pushQueue
    .catch(() => {})
    .then(async () => {
      try {
        return await githubPushOnce(g);
      } catch (e) {
        if (/ 409| 422/.test(e.message)) return await githubPushOnce(g);
        throw e;
      }
    }));
async function githubPushOnce(g) {
  let sha;
  const r0 = await fetch(githubFileUrl(g), { headers: githubHeaders(g), cache: 'no-store' });
  if (r0.ok) sha = (await r0.json()).sha;
  else if (r0.status != 404) throw new Error('GitHub error ' + r0.status);
  const d = { app: 'liftlog', v: 1, t: Date.now() };
  for (const n of STORES) d[n] = await getAll(n);
  d.bw = bodyweight() || undefined;
  d.ht = height() || undefined;
  const r = await fetch(githubFileUrl(g), {
    method: 'PUT',
    cache: 'no-store',
    headers: githubHeaders(g),
    body: JSON.stringify({
      message: 'Lift Log backup',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(d)))),
      sha,
    }),
  });
  if (!r.ok)
    throw new Error('GitHub error ' + r.status + (r.status == 422 ? ' (stale file version, try again)' : ''));
  lsSet('lb', Date.now());
  lsSet('dirty', '0');
  lsSet('gherr', '');
}
async function githubPull(g) {
  const r = await fetch(githubFileUrl(g), {
    headers: githubHeaders(g, 'application/vnd.github.raw+json'),
    cache: 'no-store',
  });
  if (r.status == 404) return null;
  if (!r.ok) throw new Error('GitHub error ' + r.status);
  return JSON.parse(await r.text());
}
async function autoBackup() {
  const g = githubConfig();
  if (!g || !navigator.onLine || (!state.ex.length && !state.sets.length)) return;
  try {
    await githubPush(g);
  } catch (e) {
    lsSet('gherr', 'Last automatic backup failed: ' + e.message);
  }
  if (state.view?.t == 'set') render();
}
const DEFAULT_BACKUP_REPO = 'Germani144/lift-log-data';
function githubBackupCard() {
  const g = githubConfig(),
    lb = lastBackupTime(),
    er = lsGet('gherr');
  return (
    `<div class=card><b>Automatic backup (GitHub)</b>` +
    (g
      ? `<div class=m>On → ${esc(g.repo)}. Saves a few seconds after each change${lb ? '. Last backup ' + ageText(lb) : ''}.</div>${er ? `<div class=wr>${esc(er)}</div>` : ''}<div class=row><button class=b data-a=ghNow>Back up now</button><button class=b data-a=ghRestore>Restore</button><button class=b data-a=ghOff>Turn off</button></div>`
      : `<div class=m>Use a <b>private</b> repo just for backups and a fine-grained token limited to that repo with Contents: read and write. Don't use your Pages repo.</div><form id=ghf><input name=username autocomplete=username value="${esc(DEFAULT_BACKUP_REPO)}" hidden><label>Repo<input id=ghr value="${esc(DEFAULT_BACKUP_REPO)}" autocapitalize=off></label><label>Token<input id=ght name=password type=password autocomplete=current-password></label><button class="b p" type=submit>Turn on</button></form>`) +
    `</div>`
  );
}
Object.assign(actions, {
  ghSave: async () => {
    const repo = $('#ghr').value.trim(),
      token = $('#ght').value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return toast('Enter the repo as owner/name and a token');
    const g = { repo, token };
    try {
      const empty = !state.ex.length && !state.sets.length,
        rem = empty ? await githubPull(g) : null;
      lsSet('gh', JSON.stringify(g));
      if (rem) await applyBackup(rem);
      else if (!empty) await githubPush(g);
      toast('Automatic backup is on');
      render();
    } catch (e) {
      toast(e.message + '. Check the repo name and token permissions.');
    }
  },
  ghNow: async () => {
    try {
      await githubPush(githubConfig());
      toast('Backed up');
    } catch (e) {
      lsSet('gherr', 'Last automatic backup failed: ' + e.message);
      toast(e.message);
    }
    render();

  ghRestore: async () => {
    try {

      d ? await applyBackup(d) : toast('No backup found in that repo');

      toast(e.message);
    }
  },
  ghOff: () => {

  },
});
addEventListener('online', () => githubConfig() && autoBackup());
/* Start-up: register the service worker (offline use), open the database, draw the first screen. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // The app opens from the worker's cache (sw.js). When a new version's worker takes over, reload once so the screen
  // runs the new version; not on the very first install, and not while a field is being typed in (the workout in
  // progress is saved and reopens after the reload).
  const hadWorker = !!navigator.serviceWorker.controller;
  let reloading = false;
  const reloadWhenIdle = () => {
    if (document.activeElement?.matches?.('input,textarea,select')) return setTimeout(reloadWhenIdle, 1500);
    location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadWorker || reloading) return;
    reloading = true;
    reloadWhenIdle();
  });
  navigator.serviceWorker
    .register('sw.js', { scope: './', updateViaCache: 'none' })
    .then(reg => {
      // look for a new version in the background on every start (browsers don't always check on their own) and
      // whenever the app comes back to the screen (an installed app is often resumed rather than reopened)
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    })
    .catch(() => {});
}
